[project]
name = "eqx-zoo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Zane", email = "zane.n.neave@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "equinox>=0.13.8",
    "huggingface-hub>=1.5,<2",
    "jax>=0.11.2",
    "jaxtyping>=0.3.11",
    "numpy>=2.5.3",
    "safetensors>=0.8.0",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "torch>=2.14.0",
    "transformers>=4.51",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
ignore = ["F722"]  # jaxtyping shape strings like "seq dim" aren't Python expressions

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"scripts/**" = ["D"]
