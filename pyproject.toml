[project]
name = "eqx-zoo"
version = "0.1.0"
description = "Verified Equinox ports of pretrained models, numerically matched against Hugging Face"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Zane", email = "zane.n.neave@gmail.com" }]
requires-python = ">=3.12"
keywords = ["jax", "equinox", "llm", "transformers", "pretrained-models", "deep-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "equinox>=0.12",
    "huggingface-hub>=0.30",
    "jax>=0.5",
    "jaxtyping>=0.3",
    "safetensors>=0.5",
]

[project.urls]
Homepage = "https://github.com/xquantize/eqx-zoo"
Repository = "https://github.com/xquantize/eqx-zoo"
Issues = "https://github.com/xquantize/eqx-zoo/issues"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "torch>=2.14.0",
    "transformers>=4.51",
]

[tool.uv]
# Released transformers versions require huggingface-hub < 2. This only affects our
# lockfile; it is not part of the published package metadata.
constraint-dependencies = ["huggingface-hub<2"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
ignore = ["F722"]  # jaxtyping shape strings like "seq dim" aren't Python expressions

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
