name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run ruff format --check
      - run: uv run ruff check

  test:
    name: test (${{ matrix.resolution }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - resolution: highest
            uv-args: --locked
            pytest-args: ""
          - resolution: lowest-direct
            uv-args: --resolution lowest-direct
            pytest-args: -m "not checkpoint"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Cache checkpoints and reference activations
        if: matrix.resolution == 'highest'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/huggingface
            reference
          key: models-${{ hashFiles('tests/support/registry.py', 'tests/support/reference.py') }}
      - name: Run tests
        run: uv run ${{ matrix.uv-args }} pytest -v ${{ matrix.pytest-args }}
